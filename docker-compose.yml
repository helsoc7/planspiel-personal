# Planspiel-Plattform: Datenbank, Backend und Frontend als getrennte Container.
#   docker compose up --build        → http://localhost:8080
#   docker compose up -d db          → nur die Datenbank für die lokale Entwicklung
# Einstellungen stehen in .env (Vorlage: .env.example).
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: planspiel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORT:-planspiel}
      POSTGRES_DB: planspiel
    ports:
      # Nur auf diesem Rechner erreichbar, nicht von außen
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planspiel -d planspiel"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: ${BUILD_NETWORK:-default}
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
    environment:
      DATABASE_URL: postgres://planspiel:${POSTGRES_PASSWORT:-planspiel}@db:5432/planspiel
      JWT_SECRET: ${JWT_SECRET:-}
      DEMO_DATEN: ${DEMO_DATEN:-1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORT: ${ADMIN_PASSWORT:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      network: ${BUILD_NETWORK:-default}
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
    environment:
      API_URL: http://api:8787
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
